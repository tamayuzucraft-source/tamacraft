<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>猫アイコンメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf5e4;--card:#fffdf6;--ink:#33463f;--mute:#6f8279;--tq:#2fa8a0;--tq-soft:#d5efe9;--gr:#8fcf9f;--line:#e6dcc0;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2926;--card:#263633;--ink:#eef2e6;--mute:#a4b8ae;--tq:#4cc4bb;--tq-soft:#2f4a46;--gr:#6fb383;--line:#3a504b;--on:#12201d}}
:root[data-theme="dark"]{--bg:#1d2926;--card:#263633;--ink:#eef2e6;--mute:#a4b8ae;--tq:#4cc4bb;--tq-soft:#2f4a46;--gr:#6fb383;--line:#3a504b;--on:#12201d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:920px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.wrap{display:grid;gap:14px}
@media(min-width:760px){.wrap{grid-template-columns:340px 1fr;align-items:start}.pv{position:sticky;top:12px}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px}
.stage{background:repeating-conic-gradient(var(--tq-soft) 0 25%,transparent 0 50%) 0 0/20px 20px;border-radius:14px;aspect-ratio:1;max-width:320px;margin:0 auto}
.stage svg{width:100%;height:100%;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;color:var(--ink);cursor:pointer}
.btn{border:0;border-radius:999px;padding:10px 16px;background:var(--tq);color:var(--on);font-weight:700}
.btn.sub2{background:var(--tq-soft);color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--gr);outline-offset:2px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed=true]{background:var(--tq);border-color:var(--tq);color:var(--on)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tab{border:0;background:var(--tq-soft);border-radius:12px;padding:8px 14px;white-space:nowrap;font-weight:500}
.tab[aria-selected=true]{background:var(--tq);color:var(--on);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:4px;text-align:center;font-size:12px}
.opt svg{width:100%;display:block;border-radius:10px}
.opt[aria-pressed=true]{border-color:var(--tq);background:var(--tq-soft)}
.sl{display:grid;grid-template-columns:5.5em 1fr;gap:8px;align-items:center;margin-top:14px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--tq)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.cols label{display:flex;align-items:center;gap:8px;font-size:14px}
input[type=color]{width:44px;height:36px;border:1.5px solid var(--line);border-radius:10px;background:none;padding:2px}
h2{font-size:15px;margin:0 0 8px}
.saved{display:flex;gap:8px;flex-wrap:wrap}
.sv{position:relative;width:64px}
.sv .opt{width:64px}
.x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--card);font-size:12px;line-height:1}
.msg{min-height:1.4em;font-size:13px;color:var(--mute);margin-top:8px}
.note{font-size:12px;color:var(--mute);margin-top:10px}
</style>
</head>
<body>
<main>
<h1>猫アイコンメーカー</h1>
<p class="sub">パーツと色をえらんで、じぶんだけの猫をつくろう</p>
<div class="wrap">
<section class="card pv" aria-label="プレビュー">
<div class="stage" id="stage" role="img" aria-label="作成中の猫"></div>
<div class="row">
<button class="btn" id="rand">ランダム</button>
<button class="btn sub2" id="save">保存</button>
</div>
<div class="row">
<button class="btn" id="dlpng">PNGで保存</button>
<button class="btn sub2" id="dlsvg">SVGで保存</button>
</div>
<div class="msg" id="msg" role="status"></div>
<p class="note">SVGはCricut Design Spaceに読み込めます(切り抜きやアイロン転写に)。</p>
</section>
<div class="wrap" style="display:block">
<section class="card">
<h2>おまかせ配色</h2>
<div class="row" id="presets" style="margin-top:0"></div>
</section>
<section class="card" style="margin-top:14px">
<div class="tabs" role="tablist" id="tabs"></div>
<div id="panel"></div>
</section>
<section class="card" style="margin-top:14px">
<h2>保存した猫(ブラウザ内・6匹まで)</h2>
<div class="saved" id="saved"></div>
</section>
</div>
</div>
</main>
<script>
/* ---------- パーツ定義 ----------
   自作イラストを追加するときは、各リストに {n:'名前', f:(...)=>'<svg要素の文字列>'} を足すだけ。
   座標は 200x200 の中で考えます。 */
const OUT=[
{n:'まる',f:a=>`<ellipse cx="100" cy="112" rx="62" ry="54" ${a}/>`},
{n:'ふっくら',f:a=>`<ellipse cx="100" cy="114" rx="74" ry="50" ${a}/>`},
{n:'おにぎり',f:a=>`<path d="M100 58C140 58 170 90 168 122C166 150 130 164 100 164C70 164 34 150 32 122C30 90 60 58 100 58Z" ${a}/>`}];
const EAR=[
{n:'とがり',f:(c,i)=>`<path d="M44 88L52 34L92 66Z M156 88L148 34L108 66Z" fill="${c}"/><path d="M54 80L57 47L82 65Z M146 80L143 47L118 65Z" fill="${i}"/>`},
{n:'まる耳',f:(c,i)=>`<circle cx="55" cy="62" r="22" fill="${c}"/><circle cx="145" cy="62" r="22" fill="${c}"/><circle cx="55" cy="62" r="12" fill="${i}"/><circle cx="145" cy="62" r="12" fill="${i}"/>`},
{n:'のっぽ',f:(c,i)=>`<path d="M42 92L40 28L88 64Z M158 92L160 28L112 64Z" fill="${c}"/><path d="M52 80L51 46L78 65Z M148 80L149 46L122 65Z" fill="${i}"/>`}];
const EYE=[
{n:'ちょん',f:c=>`<circle r="7" fill="${c}"/><circle cx="2" cy="-2.5" r="2.2" fill="#fff"/>`},
{n:'にっこり',f:c=>`<path d="M-9 3Q0-8 9 3" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/>`},
{n:'うとうと',f:c=>`<path d="M-9-2Q0 8 9-2" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/>`},
{n:'きらきら',f:c=>`<ellipse rx="9" ry="11" fill="${c}"/><circle cx="3" cy="-4" r="3.5" fill="#fff"/><circle cx="-3" cy="4" r="1.6" fill="#fff"/>`}];
const MTH=[
{n:'ω',f:(n,l)=>`<path d="M94 123H106L100 130Z" fill="${n}"/><path d="M100 130Q94 137 88 133M100 130Q106 137 112 133" fill="none" stroke="${l}" stroke-width="2.5" stroke-linecap="round"/>`},
{n:'ちいさめ',f:(n,l)=>`<ellipse cx="100" cy="125" rx="4.5" ry="3.5" fill="${n}"/><path d="M94 132Q100 137 106 132" fill="none" stroke="${l}" stroke-width="2.5" stroke-linecap="round"/>`},
{n:'にゃー',f:(n,l)=>`<path d="M88 132Q94 140 100 132Q106 140 112 132" fill="none" stroke="${l}" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="100" cy="126" rx="5" ry="3.5" fill="${n}"/>`},
{n:'あーん',f:(n,l)=>`<path d="M94 123H106L100 130Z" fill="${n}"/><ellipse cx="100" cy="139" rx="8" ry="6" fill="#d9707c"/>`}];
const PAT=[
{n:'なし',f:()=>''},
{n:'とら',f:(p)=>`<g fill="${p}"><path d="M100 56L94 84L106 84Z"/><path d="M80 60L78 82L90 80Z"/><path d="M120 60L122 82L110 80Z"/></g>`},
{n:'ぶち',f:(p)=>`<g fill="${p}"><circle cx="68" cy="92" r="12"/><circle cx="134" cy="142" r="14"/><circle cx="122" cy="80" r="8"/></g>`},
{n:'ハチワレ',f:(p,f)=>`<rect width="200" height="100" fill="${p}"/><path d="M100 106L84 40L116 40Z" fill="${f}"/>`},
{n:'くち白',f:(p)=>`<ellipse cx="100" cy="138" rx="30" ry="22" fill="${p}"/>`}];
const EX=[['whisk','ひげ'],['blush','ほっぺ'],['bow','リボン'],['glass','めがね']];
const TABS=[['out','輪郭',OUT],['e','耳',EAR],['eye','目',EYE],['m','口',MTH],['pat','もよう',PAT],['ex','おまけ'],['col','いろ']];
const PRE=[
{n:'しろ',c:{fur:'#fffaf0',inner:'#f6c4c8',pat:'#e9e2d0',eye:'#3b3b40',nose:'#f2a0a8'},pat:0},
{n:'みけ',c:{fur:'#fffaf0',inner:'#f4bcb8',pat:'#e8a15a',eye:'#3b3b40',nose:'#f2a0a8'},pat:2},
{n:'くろ',c:{fur:'#3b3b40',inner:'#e9a3a8',pat:'#2a2a2e',eye:'#f3d36b',nose:'#e58a94'},pat:0},
{n:'ハチワレ',c:{fur:'#fffaf0',inner:'#f6c4c8',pat:'#4a4a52',eye:'#3b3b40',nose:'#f2a0a8'},pat:3},
{n:'とら',c:{fur:'#e9a862',inner:'#f6c4c8',pat:'#b8722f',eye:'#3b3b40',nose:'#f2a0a8'},pat:1},
{n:'はいいろ',c:{fur:'#b9bec6',inner:'#f0c2c8',pat:'#8b929c',eye:'#3b3b40',nose:'#f2a0a8'},pat:1},
{n:'みんと',c:{fur:'#bfe8dc',inner:'#f5c6c6',pat:'#7cc3b3',eye:'#33463f',nose:'#f2a0a8'},pat:2}];
const LABEL={fur:'からだ',inner:'耳の中',pat:'もよう',eye:'目',nose:'はな',bow:'リボン',bg:'背景'};

let S={out:0,e:0,eye:0,m:0,pat:0,ex:{whisk:true,blush:true,bow:false,glass:false},ear:1,esz:1,esp:26,bgOn:false,
col:{...PRE[1].c,bow:'#2fa8a0',bg:'#d5efe9'}};S.pat=2;
let tab='out',uid=0;
const $=id=>document.getElementById(id);

function lineCol(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (r*299+g*587+b*114)/1000<110?'#f3ede0':'#6b4f47'}

function cat(s,id){
  const c=s.col,lc=lineCol(c.fur),eh=110;
  const clip=OUT[s.out].f('');
  let g=`<g clip-path="none">${''}</g>`;g='';
  g+=`<g transform="translate(100 100) scale(${s.ear}) translate(-100 -100)">${EAR[s.e].f(c.fur,c.inner)}</g>`;
  g+=OUT[s.out].f(`fill="${c.fur}"`);
  g+=`<clipPath id="${id}">${clip}</clipPath><g clip-path="url(#${id})">${PAT[s.pat].f(c.pat,c.fur)}</g>`;
  if(s.ex.blush)g+=`<ellipse cx="66" cy="126" rx="10" ry="6" fill="#f7a8b0" opacity=".6"/><ellipse cx="134" cy="126" rx="10" ry="6" fill="#f7a8b0" opacity=".6"/>`;
  for(const d of[-1,1])g+=`<g transform="translate(${100+d*s.esp} ${eh}) scale(${s.esz})">${EYE[s.eye].f(c.eye)}</g>`;
  g+=MTH[s.m].f(c.nose,lc);
  if(s.ex.whisk)g+=`<g stroke="${lc}" stroke-width="2" stroke-linecap="round" opacity=".7" fill="none"><path d="M64 122L34 116M64 128L32 130M64 134L36 144"/><path d="M136 122L166 116M136 128L168 130M136 134L164 144"/></g>`;
  if(s.ex.glass)g+=`<g fill="none" stroke="#5a4a44" stroke-width="2.5"><circle cx="${100-s.esp}" cy="${eh}" r="15"/><circle cx="${100+s.esp}" cy="${eh}" r="15"/><path d="M${100-s.esp+15} ${eh}H${100+s.esp-15}"/></g>`;
  if(s.ex.bow)g+=`<g transform="translate(140 68) rotate(15)"><path d="M0 0L-17-11V11ZM0 0L17-11V11Z" fill="${c.bow}"/><circle r="5" fill="${c.bow}" stroke="#fff" stroke-width="1.5"/></g>`;
  const bg=s.bgOn?`<circle cx="100" cy="100" r="100" fill="${c.bg}"/>`:'';
  const inner=s.bgOn?`<g transform="translate(100 104) scale(.86) translate(-100 -100)">${g}</g>`:g;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">${bg}${inner}</svg>`;
}

function renderPreview(){$('stage').innerHTML=cat(S,'main')}

function thumb(over){return cat({...S,...over,ex:{...S.ex,...(over.ex||{})}},'t'+(uid++))}

function renderTabs(){
  $('tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" data-t="${t[0]}" aria-selected="${t[0]===tab}">${t[1]}</button>`).join('');
}
function renderPanel(){
  const p=$('panel'),T=TABS.find(t=>t[0]===tab);
  if(T[2]){
    const k=tab;
    p.innerHTML=`<div class="grid">${T[2].map((o,i)=>`<button class="opt" data-k="${k}" data-i="${i}" aria-pressed="${S[k]===i}">${thumb({[k]:i})}<span>${o.n}</span></button>`).join('')}</div>`
    +(k==='e'?slider('ear','耳の大きさ',.7,1.3,.05):'')+(k==='eye'?slider('esz','目の大きさ',.7,1.5,.05)+slider('esp','目のはば',16,38,1):'');
  }else if(tab==='ex'){
    p.innerHTML=`<div class="row" style="margin-top:0">${EX.map(x=>`<button class="chip" data-x="${x[0]}" aria-pressed="${S.ex[x[0]]}">${x[1]}</button>`).join('')}</div>`;
  }else{
    p.innerHTML=`<div class="cols">${Object.keys(LABEL).map(k=>`<label><input type="color" data-c="${k}" value="${S.col[k]}">${LABEL[k]}</label>`).join('')}</div>
    <div class="row"><button class="chip" id="bgon" aria-pressed="${S.bgOn}">まるい背景をつける</button></div>`;
  }
}
function slider(k,l,mn,mx,st){return `<label class="sl">${l}<input type="range" data-s="${k}" min="${mn}" max="${mx}" step="${st}" value="${S[k]}"></label>`}

$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;tab=b.dataset.t;renderTabs();renderPanel()};
$('panel').onclick=e=>{
  const o=e.target.closest('.opt');
  if(o){S[o.dataset.k]=+o.dataset.i;renderPreview();renderPanel();return}
  const x=e.target.closest('[data-x]');
  if(x){S.ex[x.dataset.x]=!S.ex[x.dataset.x];renderPreview();renderPanel();return}
  if(e.target.id==='bgon'){S.bgOn=!S.bgOn;renderPreview();renderPanel()}
};
$('panel').oninput=e=>{
  const t=e.target;
  if(t.dataset.s){S[t.dataset.s]=+t.value;renderPreview()}
  if(t.dataset.c){S.col[t.dataset.c]=t.value;renderPreview()}
};

/* おまかせ配色 */
$('presets').innerHTML=PRE.map((p,i)=>`<button class="chip" data-p="${i}">${p.n}</button>`).join('');
$('presets').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=PRE[+b.dataset.p];Object.assign(S.col,p.c);S.pat=p.pat;renderPreview();renderPanel()};

/* ランダム */
const rnd=n=>Math.floor(Math.random()*n);
$('rand').onclick=()=>{
  const p=PRE[rnd(PRE.length)];Object.assign(S.col,p.c);
  S.out=rnd(OUT.length);S.e=rnd(EAR.length);S.eye=rnd(EYE.length);S.m=rnd(MTH.length);S.pat=rnd(PAT.length);
  S.ex={whisk:Math.random()<.6,blush:Math.random()<.6,bow:Math.random()<.3,glass:Math.random()<.2};
  S.ear=1;S.esz=1;S.esp=26;renderPreview();renderPanel();
};

/* 書き出し */
function say(t){$('msg').textContent=t}
async function getDl(){try{if(typeof claude==='undefined')return null;return await claude.use('downloads')}catch(e){return null}}
async function out(name,data){
  const d=await getDl();
  if(d){
    try{await d.save({filename:name,data});say('保存しました')}
    catch(e){say(e&&e.code==='declined'?'キャンセルしました':'保存できませんでした。もう一度ためしてください')}
    return;
  }
  /* Claude以外(GitHub Pagesなど)で開いたときは、ふつうのダウンロード */
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:'image/svg+xml'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    say('保存しました。ダウンロードのフォルダを見てください');
  }catch(e){say('保存できませんでした。別のブラウザ(Chrome・Safari)でためしてください')}
}
$('dlsvg').onclick=()=>out('cat-icon.svg',cat(S,'ex').replace('<svg ','<svg width="600" height="600" '));
$('dlpng').onclick=()=>{
  const svg=cat(S,'ex').replace('<svg ','<svg width="800" height="800" ');
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas');cv.width=cv.height=800;
    cv.getContext('2d').drawImage(img,0,0,800,800);
    cv.toBlob(b=>b?out('cat-icon.png',b):say('画像をつくれませんでした'),'image/png');
  };
  img.onerror=()=>say('画像をつくれませんでした');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
};

/* 保存(このブラウザの中だけ) */
let SV=[];
try{SV=JSON.parse(localStorage.getItem('catmaker-saved')||'[]')}catch(e){SV=[]}
function persist(){try{localStorage.setItem('catmaker-saved',JSON.stringify(SV))}catch(e){}}
function renderSaved(){
  $('saved').innerHTML=SV.length?SV.map((s,i)=>`<div class="sv"><button class="opt" data-l="${i}" aria-label="保存した猫${i+1}を開く">${cat(s,'s'+(uid++))}</button><button class="x" data-d="${i}" aria-label="削除">×</button></div>`).join(''):'<span class="note">まだありません。「保存」をおすと、ここに並びます。</span>';
}
$('save').onclick=()=>{if(SV.length>=6){say('6匹までです。どれかを消してから保存してください');return}SV.push(JSON.parse(JSON.stringify(S)));persist();renderSaved();say('保存しました')};
$('saved').onclick=e=>{
  const d=e.target.closest('[data-d]'),l=e.target.closest('[data-l]');
  if(d){SV.splice(+d.dataset.d,1);persist();renderSaved()}
  else if(l){S=JSON.parse(JSON.stringify(SV[+l.dataset.l]));renderPreview();renderPanel()}
};

renderPreview();renderTabs();renderPanel();renderSaved();
</script>
</body>
</html>
